<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Capital City Food Carts | Madison, WI Food Cart Directory</title>
    <meta name="description" content="Find Madison, Wisconsin food carts near State Street, Library Mall, and the UW-Madison campus. Browse menus, hours, and locations for local carts." />
    <meta name="keywords" content="Madison food carts, UW Madison food carts, Madison Wisconsin food carts, State Street food carts, Library Mall food carts, Madison food trucks" />
    <meta name="author" content="Capital City Food Carts" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://capitalcityfoodcarts.com/" />

    <!-- Home hero is the LCP image; start it before the JS bundle renders the <img>.
         Stripped from per-cart pages by scripts/generate-seo-files.ts. -->
    <link rel="preload" as="image" type="image/webp" fetchpriority="high" data-home-hero
          href="/capitol-state-street-1600.webp"
          imagesrcset="/capitol-state-street-960.webp 960w, /capitol-state-street-1600.webp 1600w"
          imagesizes="100vw" />
    <link rel="preload" as="fetch" href="/carts.json" crossorigin="use-credentials" />

    <!-- Fonts load without blocking first paint (font-display: swap via the URL). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" media="print" onload="this.media='all'"
          href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600;700;800&display=swap" />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600;700;800&display=swap" />
    </noscript>

    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <meta name="theme-color" content="#C5050C" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Capital City Food Carts" />
    <meta property="og:title" content="Capital City Food Carts | Madison, WI Food Cart Directory" />
    <meta property="og:description" content="Find Madison, Wisconsin food carts near State Street, Library Mall, and the UW-Madison campus. Browse menus, hours, and locations for local carts." />
    <meta property="og:url" content="https://capitalcityfoodcarts.com/" />
    <meta property="og:image" content="https://capitalcityfoodcarts.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="State Street in Madison, Wisconsin with the State Capitol dome in view" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Capital City Food Carts | Madison, WI Food Cart Directory" />
    <meta name="twitter:description" content="Find Madison, Wisconsin food carts near State Street, Library Mall, and the UW-Madison campus. Browse menus, hours, and locations for local carts." />
    <meta name="twitter:image" content="https://capitalcityfoodcarts.com/og-image.jpg" />
    <meta name="twitter:image:alt" content="State Street in Madison, Wisconsin with the State Capitol dome in view" />

    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Capital City Food Carts",
        "url": "https://capitalcityfoodcarts.com/",
        "description": "Directory of food carts in Madison, Wisconsin, near State Street, Library Mall, and the UW-Madison campus.",
        "publisher": {
          "@type": "Organization",
          "name": "Capital City Food Carts"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
